openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A tiny example API rendered by Docstar Publisher.
servers:
  - url: https://api.example.com/v1
tags:
  - name: pets
    description: Everything about pets.
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      parameters:
        - { name: limit, in: query, schema: { type: integer }, description: Max items to return }
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
    post:
      tags: [pets]
      summary: Create a pet
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '201': { description: Created }
  /pets/{id}:
    get:
      tags: [pets]
      summary: Get a pet
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404': { description: Not found }
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Rex }
        status: { type: string, enum: [available, sold] }
